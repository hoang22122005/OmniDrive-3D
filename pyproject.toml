[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnishield-x"
version = "0.1.0"
description = "OmniShield-X camera occupancy training on Kaggle"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "Pillow>=10,<13"]

[project.optional-dependencies]
train = ["torch>=2.6,<3"]
phenikaa = ["laspy[lazrs]>=2.5,<3"]
export = ["onnx>=1.17,<2", "onnxruntime>=1.20,<2"]

[tool.setuptools.packages.find]
include = ["omnishield*"]
